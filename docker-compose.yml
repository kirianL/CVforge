services:
  db:
    image: postgres:15-alpine
    container_name: cvforge-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_password_123
      POSTGRES_DB: cvforge_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: cvforge-gotenberg
    restart: always
    ports:
      - "3000:3000"

  redis:
    image: redis:7-alpine
    container_name: cvforge-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
